<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="" />
    <title>Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="home">
    <div id="banner"></div>

    <header class="header">
      <canvas id="header-canvas" class="header-canvas" aria-hidden="true"></canvas>
      <div class="header-inner">
        <nav id="nav" class="header-links" aria-label="Social links"></nav>
        <div class="header-brand">
          <div id="tagline" class="header-pre"></div>
          <h1 id="name" class="header-name"></h1>
        </div>
      </div>
      <div class="slanted-divider" aria-hidden="true"></div>
    </header>

    <main class="home-container">
      <section class="projects-grid" id="projects" aria-label="Featured projects"></section>

      <div class="lower-grid">
        <section aria-labelledby="links-title">
          <h2 id="links-title" class="section-title"></h2>
          <div id="links"></div>
        </section>

        <section aria-labelledby="about-title">
          <h2 id="about-title" class="section-title"></h2>
          <div id="about" class="about-copy"></div>
          <div id="contact" class="contact-line"></div>
        </section>
      </div>
    </main>

    <script src="content.js"></script>
    <script src="script.js"></script>
  </body>
</html>
